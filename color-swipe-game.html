<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Color Swipe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0d1a;
    overflow: hidden;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
/* =========================
   COLOR SWIPE — полный код игры
   ========================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- НАСТРОЙКИ ЦВЕТОВ ---
// Каждая зона: название, цвет, угол направления (в радианах)
const ZONES = [
  { id: 'top',    color: '#FF6B6B', glow: '#FF6B6B44', label: '↑',  angle: -Math.PI / 2 },
  { id: 'bottom', color: '#4ECDC4', glow: '#4ECDC444', label: '↓',  angle:  Math.PI / 2 },
  { id: 'left',   color: '#45B7D1', glow: '#45B7D144', label: '←',  angle:  Math.PI },
  { id: 'right',  color: '#96CEB4', glow: '#96CEB444', label: '→',  angle:  0 }
];

// --- СОСТОЯНИЕ ИГРЫ ---
let W, H, CX, CY;                 // размеры и центр экрана
let state = 'MENU';               // MENU | PLAYING | MOVING | GAMEOVER
let score = 0;
let bestScore = 0;
let currentZoneIdx = 0;           // какой цвет сейчас у центрального круга
let timeLimit = 3.0;              // сколько секунд даётся на ход
let timeLeft = 3.0;               // сколько осталось
let round = 0;                    // номер раунда (для ускорения)

// --- ПОЗИЦИЯ КРУГА ---
let ball = { x: 0, y: 0, r: 0, tx: 0, ty: 0, moving: false, t: 0 };

// --- ЧАСТИЦЫ ---
let particles = [];

// --- ТАЙМЕРЫ ---
let lastTime = 0;

// --- ВВОД (мышь/тач) ---
let drag = { active: false, sx: 0, sy: 0, ex: 0, ey: 0 };

// ==========================================
// ИНИЦИАЛИЗАЦИЯ И ОБРАБОТКА РАЗМЕРА
// ==========================================
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  // Радиус центрального шара — ~12% от меньшей стороны
  ball.r = Math.min(W, H) * 0.12;
  // Если игра не запущена — ставим шар в центр
  if (!ball.moving) { ball.x = CX; ball.y = CY; }
}
window.addEventListener('resize', resize);
resize();

// ==========================================
// ВВОД — тач и мышь
// ==========================================
function onStart(x, y) {
  if (state !== 'PLAYING') return;
  drag.active = true;
  drag.sx = x; drag.sy = y;
  drag.ex = x; drag.ey = y;
}
function onMove(x, y) {
  if (!drag.active) return;
  drag.ex = x; drag.ey = y;
}
function onEnd() {
  if (!drag.active) return;
  drag.active = false;
  const dx = drag.ex - drag.sx;
  const dy = drag.ey - drag.sy;
  const dist = Math.hypot(dx, dy);

  let dir = null;
  if (dist < 20) {
    // Тап — определяем, в какую четверть экрана ткнули относительно центра
    const adx = drag.ex - CX;
    const ady = drag.ey - CY;
    if (Math.abs(adx) > Math.abs(ady)) {
      dir = adx > 0 ? 'right' : 'left';
    } else {
      dir = ady > 0 ? 'bottom' : 'top';
    }
  } else {
    // Свайп — по доминирующей оси
    if (Math.abs(dx) > Math.abs(dy)) {
      dir = dx > 0 ? 'right' : 'left';
    } else {
      dir = dy > 0 ? 'bottom' : 'top';
    }
  }
  if (dir) startMove(dir);
}

canvas.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', onEnd);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  onStart(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  onMove(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  onEnd();
}, { passive: false });

// ==========================================
// ЛОГИКА ИГРЫ
// ==========================================
function startGame() {
  score = 0;
  round = 0;
  timeLimit = 3.0;
  timeLeft = timeLimit;
  state = 'PLAYING';
  pickNewColor();
  ball.x = CX; ball.y = CY;
  particles = [];
}

function pickNewColor() {
  // Новый случайный цвет для центрального круга (может совпасть с предыдущим — нормально)
  currentZoneIdx = Math.floor(Math.random() * ZONES.length);
  timeLeft = timeLimit;
}

function startMove(dirId) {
  if (state !== 'PLAYING') return;
  const zone = ZONES.find(z => z.id === dirId);
  if (!zone) return;

  state = 'MOVING';
  // Куда летит шар — на 70% расстояния к краю в нужном направлении
  const dist = Math.min(W, H) * 0.35;
  ball.tx = CX + Math.cos(zone.angle) * dist;
  ball.ty = CY + Math.sin(zone.angle) * dist;
  ball.t = 0;

  // Запоминаем, куда летим, чтобы потом проверить
  ball.targetDir = dirId;
  ball.startX = ball.x;
  ball.startY = ball.y;
}

function checkResult() {
  const zone = ZONES[currentZoneIdx];
  const correct = (ball.targetDir === zone.id);

  if (correct) {
    // УСПЕХ
    score += 10;
    round++;
    timeLimit = Math.max(1.0, 3.0 - round * 0.05); // ускоряемся
    spawnParticles(ball.x, ball.y, zone.color);
    // Возвращаем в центр
    ball.startX = ball.x; ball.startY = ball.y;
    ball.tx = CX; ball.ty = CY;
    ball.t = 0;
    state = 'RETURNING';
    pickNewColor();
  } else {
    // ПРОВАЛ
    gameOver();
  }
}

function gameOver() {
  state = 'GAMEOVER';
  if (score > bestScore) bestScore = score;
}

// ==========================================
// ЧАСТИЦЫ
// ==========================================
function spawnParticles(x, y, color) {
  for (let i = 0; i < 24; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      color,
      size: 3 + Math.random() * 4
    });
  }
}

function updateParticles(dt) {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt * 2.5;
  }
  particles = particles.filter(p => p.life > 0);
}

// ==========================================
// ОТРИСОВКА
// ==========================================
function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawZone(z, x, y) {
  const r = ball.r * 0.9;
  // Свечение
  ctx.save();
  ctx.shadowColor = z.color;
  ctx.shadowBlur = 20;
  ctx.fillStyle = z.color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Внутренняя заливка чуть темнее
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
  ctx.fill();

  // Буква направления
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(r * 0.7)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(z.label, x, y);
}

function draw() {
  // Фон
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W, H);

  // Лёгкая сетка-фон
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = 0; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Позиции зон
  const offset = Math.min(W, H) * 0.38;
  const positions = [
    { x: CX, y: CY - offset },           // top
    { x: CX, y: CY + offset },           // bottom
    { x: CX - offset, y: CY },           // left
    { x: CX + offset, y: CY }            // right
  ];

  // Рисуем 4 зоны
  ZONES.forEach((z, i) => drawZone(z, positions[i].x, positions[i].y));

  // Соединительные линии (слабые)
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CX, CY); ctx.lineTo(CX, CY - offset);
  ctx.moveTo(CX, CY); ctx.lineTo(CX, CY + offset);
  ctx.moveTo(CX, CY); ctx.lineTo(CX - offset, CY);
  ctx.moveTo(CX, CY); ctx.lineTo(CX + offset, CY);
  ctx.stroke();

  // --- Центральный круг ---
  const zone = ZONES[currentZoneIdx];

  // Таймер — кольцо вокруг шара
  if (state === 'PLAYING') {
    const pct = timeLeft / timeLimit;
    const timerColor = pct > 0.5 ? '#4ECDC4' : pct > 0.25 ? '#FFD166' : '#EF476F';
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(-Math.PI / 2);
    ctx.strokeStyle = timerColor;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.shadowColor = timerColor;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, ball.r + 14, 0, Math.PI * 2 * pct);
    ctx.stroke();
    ctx.restore();
  }

  // Сам шар
  ctx.save();
  ctx.shadowColor = zone.color;
  ctx.shadowBlur = 30;
  ctx.fillStyle = zone.color;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Внутренний блик
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.arc(ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.25, 0, Math.PI * 2);
  ctx.fill();

  // --- Частицы ---
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- СЧЁТ ---
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.08)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(String(score), CX, H * 0.06);

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = `${Math.floor(Math.min(W, H) * 0.03)}px sans-serif`;
  ctx.fillText('РЕКОРД: ' + bestScore, CX, H * 0.06 + Math.min(W, H) * 0.09);

  // --- ЭКРАН МЕНЮ ---
  if (state === 'MENU') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.1)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('COLOR SWIPE', CX, CY - H * 0.15);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `${Math.floor(Math.min(W, H) * 0.04)}px sans-serif`;
    ctx.fillText('Свайпай круг в зону того же цвета', CX, CY - H * 0.02);
    ctx.fillText('Успевай до окончания времени!', CX, CY + H * 0.04);

    drawButton('НАЧАТЬ ИГРУ', CY + H * 0.18);
  }

  // --- ЭКРАН GAME OVER ---
  if (state === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#EF476F';
    ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.12)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', CX, CY - H * 0.12);

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.07)}px sans-serif`;
    ctx.fillText('Счёт: ' + score, CX, CY + H * 0.02);

    if (score >= bestScore && score > 0) {
      ctx.fillStyle = '#FFD166';
      ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.04)}px sans-serif`;
      ctx.fillText('НОВЫЙ РЕКОРД!', CX, CY + H * 0.10);
    }

    drawButton('ЕЩЁ РАЗ', CY + H * 0.20);
  }
}

function drawButton(text, y) {
  const w = Math.min(W, H) * 0.55;
  const h = Math.min(W, H) * 0.1;
  const x = CX - w / 2;
  const r = h * 0.25;

  ctx.fillStyle = '#6C5CE7';
  ctx.shadowColor = '#6C5CE7';
  ctx.shadowBlur = 20;
  drawRoundedRect(x, y, w, h, r);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.floor(h * 0.45)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, CX, y + h / 2);

  // Сохраняем область кнопки для кликов
  window._btn = { x, y, w, h };
}

// ==========================================
// ИГРОВОЙ ЦИКЛ
// ==========================================
function update(dt) {
  if (state === 'PLAYING') {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      gameOver();
    }
  }

  // Анимация движения шара
  if (state === 'MOVING') {
    ball.t += dt * 8; // скорость анимации
    if (ball.t >= 1) {
      ball.t = 1;
      ball.x = ball.tx;
      ball.y = ball.ty;
      checkResult();
    } else {
      // ease-out
      const e = 1 - Math.pow(1 - ball.t, 3);
      ball.x = ball.startX + (ball.tx - ball.startX) * e;
      ball.y = ball.startY + (ball.ty - ball.startY) * e;
    }
  }

  if (state === 'RETURNING') {
    ball.t += dt * 10;
    if (ball.t >= 1) {
      ball.t = 1;
      ball.x = CX;
      ball.y = CY;
      state = 'PLAYING';
    } else {
      const e = 1 - Math.pow(1 - ball.t, 3);
      ball.x = ball.startX + (CX - ball.startX) * e;
      ball.y = ball.startY + (CY - ball.startY) * e;
    }
  }

  updateParticles(dt);
}

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // ограничиваем dt
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ==========================================
// ОБРАБОТКА КЛИКОВ ПО КНОПКАМ
// ==========================================
function handleMenuClick(x, y) {
  if (!window._btn) return;
  const b = window._btn;
  if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
    startGame();
  }
}

canvas.addEventListener('mousedown', e => {
  if (state === 'MENU' || state === 'GAMEOVER') handleMenuClick(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
  if (state === 'MENU' || state === 'GAMEOVER') {
    const t = e.changedTouches[0];
    handleMenuClick(t.clientX, t.clientY);
  }
}, { passive: false });

// ==========================================
// СТАРТ
// ==========================================
requestAnimationFrame(loop);
</script>
</body>
</html>
